name: Dependency versions
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  test-dependency-versions:
    timeout-minutes: 15
    name: deps (${{ matrix.gem }} ${{ matrix.version }})
    runs-on: 'ubuntu-latest'
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gem: base64, version: "~> 0.1.0" }
          - { gem: base64, version: "~> 0.3", save-cache: true }
          - { gem: connection_pool, version: "~> 2.2.0" }
          - { gem: connection_pool, version: "~> 2.5" }
          - { gem: connection_pool, version: "~> 3.0" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          # setup-ruby would install from the lockfile before the override below applies.
          bundler-cache: false

      - name: Configure gem cache
        id: gem-cache
        run: |-
          bundle config set --local path vendor/bundle
          echo "prefix=gems-${ImageOS}-ruby-$(cat .ruby-version)-" >> "$GITHUB_OUTPUT"

      - name: Restore gem cache
        id: restore-gems
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            vendor/bundle
            ~/.bundle/cache/compact_index
          key: ${{ steps.gem-cache.outputs.prefix }}${{ hashFiles('Gemfile', 'Gemfile.lock', '*.gemspec') }}
          restore-keys: ${{ steps.gem-cache.outputs.prefix }}

      # The lockfile is not authoritative here: pin the matrix gem via the
      # Gemfile's env-driven override and re-resolve it.
      - name: Resolve ${{ matrix.gem }} at ${{ matrix.version }}
        env:
          MATRIX_GEM: ${{ matrix.gem }}
          MATRIX_VERSION: ${{ matrix.version }}
        run: |-
          gem_upper=$(echo "$MATRIX_GEM" | tr '[:lower:]' '[:upper:]')
          echo "ANTHROPIC_TEST_${gem_upper}_VERSION=${MATRIX_VERSION}" >> "$GITHUB_ENV"
          export "ANTHROPIC_TEST_${gem_upper}_VERSION=${MATRIX_VERSION}"
          bundle lock --update "$MATRIX_GEM"
          bundle install
          bundle clean
          bundle info "$MATRIX_GEM"

      # Only a cache saved from the default branch can be restored by every other
      # branch. The matrix shares one key and a key is written once, so a single
      # entry saves: the one that resolves closest to the lockfile.
      - name: Save gem cache
        if: |-
          matrix.save-cache &&
          steps.restore-gems.outputs.cache-hit != 'true' &&
          (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            vendor/bundle
            ~/.bundle/cache/compact_index
          key: ${{ steps.restore-gems.outputs.cache-primary-key }}

      - name: Run tests
        run: ./scripts/test
